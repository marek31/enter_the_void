<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Default families. Liberation/Carlito/Caladea keep MS Office documents laid out correctly. -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Noto Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family><family>Symbols Nerd Font Mono</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias><family>Cambria</family><accept><family>Caladea</family></accept></alias>
</fontconfig>
