# Folders kept in sync with pCloud by `cloud sync` (both ways). One pair per line:
#   <local folder>   <pCloud folder>
# The first sync of a pair merges both sides and deletes nothing; after that deletions sync too
# (a run that would delete more than 25 % of a folder stops instead). Edits on both sides:
# the newer file wins, the other is kept renamed.
# Examples - remove the leading # to use:
#~/Documents/Work      Work
#~/Pictures/Phone      Phone/Camera
