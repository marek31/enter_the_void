# foot terminal. Colours: Noctalia adds `include=~/.config/foot/themes/noctalia` under [main].
[main]
shell=fish
font=JetBrains Mono:size=11, Symbols Nerd Font Mono:size=11
pad=14x12 center
dpi-aware=no

[scrollback]
lines=20000

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.92
