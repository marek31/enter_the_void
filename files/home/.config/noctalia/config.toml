# Noctalia v5 - x1-void. Changes made in the Settings window (Mod+Comma) go to
# ~/.local/state/noctalia/settings.toml and override this file.
# Reference: https://docs.noctalia.dev/noctalia/configuration/

[theme]
mode = "dark"
source = "builtin"
builtin = "Noctalia"

[shell]
font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%A, %d.%m.%Y"
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 200
corner_radius_scale = 1.0

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.85
compositor_blur = true
radius = 14
margin_ends = 12
margin_edge = 8
padding = 14
widget_spacing = 6
shadow = true
capsule = true
start = ["launcher", "workspaces", "media"]
center = ["clock"]
end = ["tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "session"]

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade", "disc", "wipe"]
transition_duration = 1200
directory = "@HOME@/Pictures/Wallpapers"

[wallpaper.automation]
enabled = false
interval_seconds = 1800
order = "random"

# blurred wallpaper behind workspaces in the niri overview (pairs with the layer-rule in niri config)
[backdrop]
enabled = true
blur_intensity = 0.5
tint_intensity = 0.3

[lockscreen]
enabled = true
fingerprint = true          # fprintd; enrol once with: fprintd-enroll
blurred_desktop = true
blur_intensity = 0.6
tint_intensity = 0.3

[idle.behavior.lock]
timeout = 300
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 360
action = "screen_off"
enabled = true

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[notification]
enable_daemon = true
background_opacity = 0.92
border = true

[dock]
enabled = false
