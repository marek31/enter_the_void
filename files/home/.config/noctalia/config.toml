# Noctalia v5 - x1-void. Minimal look: one palette everywhere, thin edge-glued bar, few widgets.
# Changes made in Settings (Mod+Comma) go to ~/.local/state/noctalia/settings.toml and win over this file.
# Reference: https://docs.noctalia.dev/noctalia/configuration/

[theme]
mode = "dark"
source = "builtin"           # other choices: "wallpaper" (Material You from the wallpaper), "community"
builtin = "Kanagawa"         # also: Rosé Pine, Catppuccin, Tokyo-Night, Nord, Gruvbox, Ayu, Noctalia...
wallpaper_scheme = "m3-tonal-spot"   # used only with source = "wallpaper"

# Push the palette to everything else, so the desktop has exactly one colour scheme.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["foot", "gtk3", "gtk4", "qt", "kcolorscheme", "niri", "btop", "starship"]

[shell]
font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%a %d %b"
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 200
corner_radius_scale = 1.0

# panels, launcher, OSD: no animations. For fast ones: enabled = true, speed = 3.0 (0.1 slow .. 4.0 fastest)
[shell.animation]
enabled = false
speed = 3.0

# single thin vertical bar on the left, flush with the screen edge, full height, square corners
[bar.main]
position = "left"
thickness = 30
background_opacity = 0.80
compositor_blur = true
radius = 0
margin_ends = 0
margin_edge = 0
padding = 12
widget_spacing = 4
shadow = false
capsule = true
start = ["launcher", "taskbar"]
center = ["clock"]
end = ["tray", "network", "bluetooth", "volume", "battery", "control-center"]

# workspaces as capsules holding the icons of their apps (replaces the plain 1 2 3 workspaces widget).
# Click = focus, middle-click = close. App names need a horizontal bar (show_window_title, no grouping).
[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
group_single_icon_per_app = true

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade"]
transition_duration = 300
directory = "@HOME@/Pictures/Wallpapers"

[wallpaper.default]
path = "@HOME@/Pictures/Wallpapers/great-wave.jpg"

[wallpaper.automation]
enabled = false

# blurred wallpaper behind workspaces in the niri overview (pairs with the layer-rule in niri config)
[backdrop]
enabled = true
blur_intensity = 0.6
tint_intensity = 0.35

[lockscreen]
enabled = true
fingerprint = true          # fprintd; enrol once with: fprintd-enroll
blurred_desktop = true
blur_intensity = 0.7
tint_intensity = 0.35
transition = ["fade"]
transition_duration = 100

# lock after 60 min idle, screen off 1 min later
[idle.behavior.lock]
timeout = 3600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 3660
action = "screen_off"
enabled = true

# control center tiles: Noctalia's default set minus caffeine (keep-awake); "weather" etc. can be added
[[control_center.shortcuts]]
type = "wifi"
[[control_center.shortcuts]]
type = "bluetooth"
[[control_center.shortcuts]]
type = "nightlight"
[[control_center.shortcuts]]
type = "notification"
[[control_center.shortcuts]]
type = "power_profile"

# no weather anywhere (control-center tab, bar/desktop widgets) and no periodic weather/location requests
[weather]
enabled = false

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[notification]
enable_daemon = true
background_opacity = 0.92
border = false

[dock]
enabled = false

# screen recording (gpu-screen-recorder): Super+PrtSc start/stop, Super+Shift+PrtSc region.
# Codec, quality, output folder: Settings > Plugins > Screen Recorder.
[plugins]
enabled = ["noctalia/screen_recorder"]
