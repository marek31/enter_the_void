# Noctalia v5 - x1-void. Minimal look: one palette everywhere, thin floating bar, few widgets.
# Changes made in Settings (Mod+Comma) go to ~/.local/state/noctalia/settings.toml and win over this file.
# Reference: https://docs.noctalia.dev/noctalia/configuration/

[theme]
mode = "dark"
source = "builtin"           # other choices: "wallpaper" (Material You from the wallpaper), "community"
builtin = "Kanagawa"         # also: Rosé Pine, Catppuccin, Tokyo-Night, Nord, Gruvbox, Ayu, Noctalia...
wallpaper_scheme = "m3-tonal-spot"   # used only with source = "wallpaper"

# Push the palette to everything else, so the desktop has exactly one colour scheme.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["foot", "gtk3", "gtk4", "qt", "kcolorscheme", "niri", "btop", "starship"]

[shell]
font_family = "Inter"
time_format = "{:%H:%M}"
date_format = "%a %d %b"
telemetry_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 200
corner_radius_scale = 1.0

# single vertical bar on the left (no top or bottom bar)
[bar.main]
position = "left"
thickness = 38
background_opacity = 0.80
compositor_blur = true
radius = 12
margin_ends = 14
margin_edge = 8
padding = 12
widget_spacing = 4
shadow = false
capsule = true
start = ["launcher", "workspaces"]
center = ["clock"]
end = ["tray", "network", "bluetooth", "volume", "battery", "control-center"]

[wallpaper]
enabled = true
fill_mode = "crop"
transition = ["fade"]
transition_duration = 800
directory = "@HOME@/Pictures/Wallpapers"

[wallpaper.default]
path = "@HOME@/Pictures/Wallpapers/great-wave.jpg"

[wallpaper.automation]
enabled = false

# blurred wallpaper behind workspaces in the niri overview (pairs with the layer-rule in niri config)
[backdrop]
enabled = true
blur_intensity = 0.6
tint_intensity = 0.35

[lockscreen]
enabled = true
fingerprint = true          # fprintd; enrol once with: fprintd-enroll
blurred_desktop = true
blur_intensity = 0.7
tint_intensity = 0.35
transition = ["fade"]

# lock after 60 min idle, screen off 1 min later
[idle.behavior.lock]
timeout = 3600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 3660
action = "screen_off"
enabled = true

[nightlight]
enabled = true
temperature_day = 6500
temperature_night = 4000

[notification]
enable_daemon = true
background_opacity = 0.92
border = false

[dock]
enabled = false
