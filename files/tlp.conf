# TLP 1.10 for ThinkPad X1 Carbon Gen 10 (Alder Lake). Check: sudo tlp-stat -s -p -b
# Three profiles; Noctalia's power-profile switch picks between them (via tlp-pd):
#   PRF performance   = *_ON_AC values   (only when chosen by hand)
#   BAL balanced      = *_ON_BAT values  -> automatic on AC  ("balanced performance")
#   SAV power-saver   = *_ON_SAV values  -> automatic on battery ("maximum power saving")
# Settings without an _ON_SAV variant (Wi-Fi, audio, runtime PM, ...) use their _ON_BAT value in SAV,
# so those are set to save power.
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV
TLP_PROFILE_DEFAULT=BAL

# CPU (intel_pstate active: powersave governor + energy/performance preference does the work)
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0
# cap at 60 % of max speed on battery (TLP's own suggestion); raise if compiling on battery feels slow
CPU_MAX_PERF_ON_SAV=60

PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
PLATFORM_PROFILE_ON_SAV=low-power

# Iris Xe graphics (min 100MHz, max/boost 900MHz on battery)
INTEL_GPU_MIN_FREQ_ON_BAT=100
INTEL_GPU_MIN_FREQ_ON_SAV=100
INTEL_GPU_MAX_FREQ_ON_BAT=900
INTEL_GPU_MAX_FREQ_ON_SAV=900
INTEL_GPU_BOOST_FREQ_ON_BAT=900
INTEL_GPU_BOOST_FREQ_ON_SAV=900

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# no _ON_SAV variants: these _ON_BAT values also apply on battery
RUNTIME_PM_ON_AC=auto
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST=""
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
USB_AUTOSUSPEND=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_AUDIO=0
NMI_WATCHDOG=0

# Battery wear: uncomment to stop charging at 80 % (one-off full charge: sudo tlp fullcharge)
#START_CHARGE_THRESH_BAT0=75
#STOP_CHARGE_THRESH_BAT0=80
